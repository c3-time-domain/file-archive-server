services:
  make-archive-directories:
    image: rknop/file-archive-server:tests
    build:
      context: ../
      args:
        UID: 0
        GID: 0
    volumes:
      - type: volume
        source: archive-storage
        target: /storage
    entrypoint: bash -c "mkdir -p /storage/base && chmod a+rwx /storage/base"

  archive-server:
    depends_on:
      make-archive-directories:
        condition: service_completed_successfully
    image: rknop/file-archive-server:tests
    build:
      context: ../
      args:
        UID: 0
        GID: 0
    healthcheck:
      test: netcat -w 1 localhost 8080 || exit 1
      interval: 5s
      timeout: 10s
      retries: 5
    environment:
      - CONNECTOR_READ_STORAGE=/storage_ro/base
      - CONNECTOR_WRITE_STORAGE=/storage/base
      - CONNECTOR_SECRETS=/run/secrets
    volumes:
      - type: volume
        source: archive-storage
        target: /storage
      - type: volume
        source: archive-storage
        target: /storage_ro
        read_only: true
    secrets:
      - connector_tokens
      - flask_secret_key
    # Uncomment this if needed for debugging
    # entrypoint: [ "tail", "-f", "/etc/issue" ]

  shell:
    depends_on:
      archive-server:
        condition: service_healthy
    image: rknop/file-archive-server-test:tests
    build:
      context: ../
      args:
        UID: 0
        GID: 0
    volumes:
      - type: bind
        source: ..
        target: /archive
      - type: volume
        source: local-storage
        target: /local_archive
      - type: volume
        source: local-storage
        target: /local_archive_ro
        read_only: true
    secrets:
      - connector_tokens
    entrypoint: [ "tail", "-f", "/etc/issue" ]

  runtests:
    depends_on:
      archive-server:
        condition: service_healthy
    image: rknop/file-archive-server-test:tests
    build:
      context: ../
      args:
        UID: 0
        GID: 0
    volumes:
      - type: bind
        source: ..
        target: /archive
      - type: volume
        source: local-storage
        target: /local_archive
      - type: volume
        source: local-storage
        target: /local_archive_ro
        read_only: true
    secrets:
      - connector_tokens
    working_dir: /archive/tests
    entrypoint: [ "pytest", "-v" ]


secrets:
  connector_tokens:
    file: connector_tokens.txt
  flask_secret_key:
    file: flask_secret_key.txt

volumes:
  archive-storage:
  local-storage:
